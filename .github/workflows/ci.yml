# Pipeline de CI/CD (PDF §5): bloquea el despliegue en Vercel si falla cualquier prueba.
#
#   quality ─┐
#            ├─► e2e ─► migrate-prod ─► deploy ─► smoke
#   unit ────┘
#
# Los 3 últimos solo corren en main (push o "Run workflow") y con la variable
# DEPLOY_ENABLED=true; nunca en pull requests.
#
# vercel.json desactiva los despliegues automáticos desde Git: la única vía a
# producción es el job `deploy`, que depende de que pasen todas las pruebas.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, formato y tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Pruebas unitarias e integración (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: Flujos E2E (Playwright + Supabase local)
    needs: [quality, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Solo para el Supabase local del runner; no es un secreto de producción.
      E2E_TEST_API_TOKEN: ci-e2e-token-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Arrancar Supabase local
        run: |
          cp supabase/.env.example supabase/.env
          npx supabase start -x "storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor"

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Aplica migraciones, crea el usuario de prueba, compila y sirve la app.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Parar Supabase local
        if: always()
        run: npx supabase stop --no-backup

  migrate-prod:
    name: Migraciones de producción
    needs: e2e
    # Solo en main (push o lanzamiento manual "Run workflow"), nunca en pull requests.
    # DEPLOY_ENABLED (variable del repositorio) se activa cuando los secretos de
    # Vercel y Supabase ya están configurados; hasta entonces solo corren las pruebas.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: drizzle-kit migrate
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL_DIRECT: ${{ secrets.PROD_DATABASE_URL_DIRECT }}

  deploy:
    name: Despliegue en Vercel
    needs: migrate-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --global vercel@65.2.0
      # Descarga las variables de entorno de producción configuradas en Vercel.
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Las NEXT_PUBLIC_* se incrustan en el código AL COMPILAR (cliente y proxy).
      # `vercel pull` no descarga las variables marcadas como "Sensitive" en Vercel:
      # quedarían vacías y la app respondería 500. Se toman de las variables del
      # repositorio (no son secretas: la publishable key es pública por diseño) o,
      # si no existen, de lo descargado; y si siguen vacías, el despliegue se detiene.
      - name: Variables públicas del build
        env:
          # Se aceptan como Variable o como Secret del repositorio.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.PROD_URL }}
          NEXT_PUBLIC_CURRENCY: ${{ vars.NEXT_PUBLIC_CURRENCY || 'USD' }}
          NEXT_PUBLIC_LOCALE: ${{ vars.NEXT_PUBLIC_LOCALE || 'es-ES' }}
          NEXT_PUBLIC_TIME_ZONE: ${{ vars.NEXT_PUBLIC_TIME_ZONE || 'UTC' }}
        run: |
          file=.vercel/.env.production.local
          touch "$file"
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_CURRENCY NEXT_PUBLIC_LOCALE NEXT_PUBLIC_TIME_ZONE; do
            value="${!key}"
            source="GitHub"
            if [ -z "$value" ]; then
              value=$(grep -E "^${key}=" "$file" | head -n1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//')
              source="vercel pull"
            fi
            # Quita espacios y saltos de línea pegados por error al copiar el valor.
            value=$(printf '%s' "$value" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$value" ]; then
              echo "::error::$key está vacía. Créala en GitHub (Settings → Secrets and variables → Actions → Variables) o quítale 'Sensitive' en Vercel."
              exit 1
            fi
            { grep -vE "^${key}=" "$file" || true; } > "$file.tmp"
            printf '%s="%s"\n' "$key" "$value" >> "$file.tmp"
            mv "$file.tmp" "$file"
            echo "$key: definida desde $source (${#value} caracteres)"
          done

          # Formato esperado (datos públicos; se muestran para poder diagnosticar).
          url=$(grep -E '^NEXT_PUBLIC_SUPABASE_URL=' "$file" | cut -d= -f2- | tr -d '"')
          key=$(grep -E '^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=' "$file" | cut -d= -f2- | tr -d '"')
          echo "Supabase URL: $url"
          echo "Publishable key: ${key:0:15}… (${#key} caracteres)"
          if ! printf '%s' "$url" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$'; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL no tiene la forma https://<ref>.supabase.co (sin / final ni comillas)."
            exit 1
          fi
          if ! printf '%s' "$key" | grep -Eq '^(sb_publishable_|eyJ)'; then
            echo "::error::NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY no parece una publishable key (sb_publishable_…)."
            exit 1
          fi
          echo "SUPABASE_HOST=${url#https://}" >> "$GITHUB_ENV"

      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Comprueba ANTES de publicar que la URL de Supabase quedó incrustada en el
      # código compilado; si no, el proxy respondería 500 en todas las páginas.
      # -R sigue enlaces simbólicos: las funciones de .vercel/output apuntan a
      # los archivos compilados de .next en lugar de copiarlos.
      - name: Verificar el build
        run: |
          matches=$(grep -RlF --include='*.js' "$SUPABASE_HOST" .next/server .vercel/output 2>/dev/null | wc -l)
          echo "Archivos compilados que contienen $SUPABASE_HOST: $matches"
          if [ "$matches" -eq 0 ]; then
            echo "::error::La URL de Supabase no está en el build: el proxy fallaría con 500. No se despliega."
            exit 1
          fi

      # Sube el build. --prod lo marca como producción; `vercel promote` además
      # mueve el dominio público aunque antes se hubiera hecho un rollback manual
      # en Vercel (tras un rollback, Vercel deja de asignarlo automáticamente).
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Desplegado en $url"
          vercel promote "$url" --yes --timeout=5m --token=${{ secrets.VERCEL_TOKEN }}
          echo "Dominio de producción apuntando a $url"

  smoke:
    name: Verificación de humo en producción
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Sin --reset: no modifica datos; comprueba los 3 endpoints de auditoría y
      # que reset-data rechaza peticiones sin token. La latencia desde el runner
      # incluye la red de GitHub, por eso es informativa (--latency-info).
      - run: npx tsx scripts/audit-endpoints.ts "${{ secrets.PROD_URL }}" --latency-info
